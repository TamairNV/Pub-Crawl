
<body>
<div>

  <h2>Login</h2>

  <input type="text" [(ngModel)]="userName" placeholder="Name">
  <input type="text" [(ngModel)]="userPasskey" placeholder="1234">
  <label for="camera">Take a photo:</label>
  <input type="file" id="camera" accept="image/*" capture="environment">

  <button (click)="createUser()">Send User to Flask</button>

  <div>{{ incorrect_login() }}</div>

  <div>
     <a routerLink="/create-account">Create Account</a>
  </div>
</div>

</body>
