
<div class="auth-page-wrapper">
<div class="auth-card">
  <h2>Create Your Account</h2>

  <div class="auth-notice" role="note">
    <strong>Heads up:</strong> Forget your passkey mid-crawl? Your ref can give you a new one. Use something simple, and don't reuse a personal password.
  </div>

  <div class="form-group">
    <input type="text" class="form-control" [(ngModel)]="userName" placeholder="Username">
  </div>

  <div class="form-group">
    <input type="text" class="form-control" [(ngModel)]="userPasskey" placeholder="Passkey (e.g., 1234)">
  </div>

  <button class="btn-primary" (click)="createUser()">Create Account</button>

  <div class="error-message">{{ userNameTaken() }}</div>

  <p class="legal-note">By signing up you confirm you're 18+ and agree to the <a routerLink="/terms">Terms</a> and <a routerLink="/privacy">Privacy</a> notice.</p>
  <div class="divider"></div>

  <a routerLink="/login" class="link-as-button">Already have an account? Login</a>
</div>

</div>
