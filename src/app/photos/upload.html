<div class="form-group">
  <input
    type="file"
    class="form-control file-input"
    multiple
    accept="image/*,video/*"
    (change)="onFilesSelected($event)"
    [disabled]="isUploading"
  >

  <button class="btn btn-primary mt-3" (click)="upload()" *ngIf="!isUploading" [disabled]="!selectedFiles || selectedFiles.length === 0">
    Upload Files
  </button>

  <div class="progress-container mt-3" *ngIf="isUploading">
    <p class="status-text"><strong>{{ uploadStatusText }}</strong></p>

    <div class="progress" style="height: 25px;">
      <div
        class="progress-bar progress-bar-striped progress-bar-animated bg-success"
        role="progressbar"
        [style.width.%]="uploadProgress"
        [attr.aria-valuenow]="uploadProgress"
        aria-valuemin="0"
        aria-valuemax="100">
        {{ uploadProgress }}%
      </div>
    </div>
  </div>
</div>
