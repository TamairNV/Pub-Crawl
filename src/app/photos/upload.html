<div class="fun-card">
  <h2>Upload Media</h2>

  <button class="btn back-btn" [routerLink]="['/map-view', currentEventID]">
    ⬅ Back
  </button>

  <div class="rule-box">
    <p><strong>📸 Heads up:</strong> Please only upload photos you have taken with your camera, otherwise there won't be any timestamp.</p>
  </div>

  <div class="form-group">
    <input
      type="file"
      class="file-input"
      multiple
      accept="image/*,video/*"
      (change)="onFilesSelected($event)"
      [disabled]="isUploading"
    >

    <button
      class="btn btn-primary"
      (click)="upload()"
      *ngIf="!isUploading"
      [disabled]="!selectedFiles || selectedFiles.length === 0">
      Upload Files
    </button>

    <div class="progress-container" *ngIf="isUploading">
      <p class="status-text">{{ uploadStatusText }}</p>

      <div class="progress-bar-track">
        <div class="progress-bar-fill" [style.width.%]="uploadProgress"></div>
      </div>

      <span class="progress-percentage">{{ uploadProgress }}%</span>
    </div>

  </div>
</div>
